# DevSpec board — one entry per change, not per subtask.
# Subtasks live in each change's tasks.md; this file carries status and
# cross-change ordering only.
changes:
  add-login:
    title: login page, JWT cookie session, users table + seeded admin
    tasks_md: archive/add-login/tasks.md
    depends_on: []
    skills: [frontend-design, typeorm]
    status: done
    archived: archive/add-login
    owner: "worker-local"
    notes: >-
      CLOSED as done by LE AN on 2026-10-01 — the only open item was the
      PRE-EXISTING `pnpm test:e2e` failure, declared out of scope.
      Prior blocker text, kept for history: section 9 `pnpm test:e2e` fails on the PRE-EXISTING
      test/app.e2e-spec.ts (asserts GET / -> "Hello World!" from an AppController
      this repo does not have). All 4 tests this change added pass; sections 1-8
      are verified. See devspec/report/blockers.md and
      devspec/changes/add-login/verify/fixes.md.
      First change in the repo. Establishes three precedents everything after
      copies: the first domain modules (src/users/, src/auth/), the first
      migration this project has ever run, and the table/column naming recorded
      in devspec/context/schema.md. Refresh schema.md once the migration lands.
      Section 1 fixes the frontend dev port and CORS_ORIGINS; nothing in the
      change works in a browser until it does.
  add-app-shell:
    title: collapsible sidebar shell, mobile drawer, sample dashboard
    tasks_md: archive/add-app-shell/tasks.md
    depends_on: []
    skills: [frontend-design]
    status: done
    owner: "worker-local"
    notes: >-
      Frontend only — nothing under backend/ is touched, no endpoint, entity,
      migration or env var, and no new npm dependency.
      NOT declared as depends_on [add-login] on purpose. This change does consume
      add-login's output (stores/auth.ts, hooks/use-auth.ts, components/ui/button.tsx,
      the cookie session), but that code is already built and verified in the working
      tree. add-login sits at status: blocked only on the PRE-EXISTING
      test/app.e2e-spec.ts failure in the backend, which has nothing to do with this
      change — declaring the dep would stall this work behind an unrelated red test.
      Flip to depends_on: [add-login] if the board must mirror strict lineage.
      Two deletions are part of the work and must land in the same commit as their
      replacements: frontend/app/page.tsx (its route moves to app/(app)/page.tsx —
      two files cannot own "/") and frontend/components/auth/user-chip.tsx (absorbed
      by components/nav/nav-user.tsx).
      Section 1 hand-copies eight shadcn primitives because the shadcn CLI hangs in
      this environment (devspec/context/rules.md). Transcription error is the most
      likely defect in this change; tsc + eslint + rendering each one is the check.
      devspec/context/conventions.md is STALE for the frontend — it still describes
      @/* -> ./app/* with everything under app/. frontend/CLAUDE.md is authoritative:
      @/* resolves to the frontend root. Refreshing the context pack is a separate job.
  add-feedback-layer:
    title: toast notifications and confirm dialogs as reusable frontend scaffold
    tasks_md: archive/add-feedback-layer/tasks.md
    depends_on: []
    skills: [frontend-design]
    status: done
    archived: archive/add-feedback-layer
    owner: "worker-local"
    notes: >-
      Frontend only. No backend file, entity, migration, endpoint, DTO or env var
      is touched, so `pnpm api:types` never runs. One new dependency: sonner.
      NOT declared as depends_on [add-login] on purpose, for the same reason
      add-app-shell wasn't. This change edits add-login's `hooks/use-auth.ts` (a
      no-op onError on useLogin and useLogout) and add-app-shell's
      `components/sidebar/nav-user.tsx` (sign-out routed through confirm), but both
      files are already built and verified in the working tree. add-login sits at
      status blocked only on the PRE-EXISTING `test/app.e2e-spec.ts` failure in the
      backend, which has nothing to do with this change; declaring the dep would
      stall frontend work behind an unrelated red test. Flip to
      depends_on: [add-login] if the board must mirror strict lineage.
      Two SHARED files are touched and are where a reviewer should look hardest:
      `components/provider/query-provider.tsx` (adds a MutationCache whose onError
      reaches every mutation in the app) and `app/layout.tsx` (two new providers).
      The override mechanism is `if (mutation.options.onError) return;` — React Query
      runs cache-level AND mutation-level handlers, so that check is the only thing
      making a local onError an override. Its known cost is recorded in design.md:
      a mutation defining onError for an unrelated reason (optimistic rollback)
      silently loses its error toast.
      Section 1 adds the only two new theme tokens (`--success`, `--warning`).
      Section 5 hand-copies the alert-dialog primitive because the shadcn CLI hangs
      in this environment (devspec/context/rules.md) — transcription error is the
      most likely defect, and tsc + eslint + rendering it is the check.
      Section 9 adds a TEMPORARY demo card to `app/(app)/page.tsx`, marked with a
      `ponytail:` comment. It exists so the four tones and the pending/failure paths
      are reviewable before any real screen uses them. Delete it in the first change
      that ships real actions — nothing enforces that.
      Dark mode has no toggle (nothing sets `.dark`), so section 10's dark pass means
      setting the class by hand in devtools. Adding a toggle is out of scope.
      devspec/context/conventions.md is STALE for the frontend — it still describes
      `@/*` -> ./app/* with everything under app/. frontend/CLAUDE.md is
      authoritative: `@/*` resolves from the frontend root. Refreshing the context
      pack is a separate job.
  add-file-storage:
    title: file service + files table, local disk storage behind authenticated upload/download
    tasks_md: archive/add-file-storage/tasks.md
    depends_on: []
    skills: [typeorm]
    status: done
    archived: archive/add-file-storage
    owner: "worker-local"
    notes: >-
      Approved by LE AN on 2026-10-01. Artifacts complete: proposal.md, design.md,
      spec.md, tasks.md, db.md (live-schema grounded), spec.html. Req coverage is
      clean — req-1..req-7 each have a tasks.md section, and all 7 sections carry a
      runnable Verify: line with no MANUAL gate.
      Backend only. The one frontend touch is `frontend/app/types/api/**`, which is
      REGENERATED by `pnpm api:types` (task 7.1) and must never be hand-edited. No
      screen, component or visible element changes, which is why there is no ui.md
      and no frontend-design skill.
      NOT declared as depends_on [add-login] on purpose, for the same reason
      add-app-shell and add-feedback-layer weren't. This change consumes add-login's
      output (the `users` table, `JwtAuthGuard`, `SESSION_COOKIE`), but all of it is
      already built and verified in the working tree. add-login sits at status
      blocked only on the PRE-EXISTING `test/app.e2e-spec.ts` failure (it asserts
      GET / -> "Hello World!" against an AppController this repo does not have),
      which has nothing to do with file storage — declaring the dep would stall this
      work behind an unrelated red test. Flip to depends_on: [add-login] if the board
      must mirror strict lineage.
      Two SHARED files are where a reviewer should look hardest.
      `backend/src/config/env.validation.ts` adds a REQUIRED `FILE_STORAGE_PATH`
      with no code default — every existing `.env` becomes invalid until the var is
      added, so the `.env.example` row (task 1.2) and a line in the commit message
      are what make that survivable. This is the same cost `JWT_SECRET` already
      imposes and is consistent with rules.md. `backend/src/app.module.ts` gains one
      import line registering FilesModule.
      Entity registration is a trap: `app.module.ts` passes `entities: []` +
      `autoLoadEntities: true` on purpose (the raw-.ts glob breaks vitest), so
      `TypeOrmModule.forFeature([FileEntity])` inside FilesModule is the ONLY thing
      that registers the entity. Registering it anywhere else is a silent no-op.
      Four decisions that look like nits and are not. (1) The class is `FileEntity`,
      not `File` — `File` is a Node global and shadowing it inside upload code is a
      3am trap. (2) `size_bytes` is `integer`, NOT `bigint` — TypeORM returns bigint
      as a JS string, which would ship as `"1048576"` through FileDto; int caps at
      ~2GB, 21x the 100MB limit. (3) multer must use `diskStorage` with its temp dir
      UNDER `FILE_STORAGE_PATH` — the default `memoryStorage` would buffer 100MB per
      concurrent upload in RAM, and a temp dir on another filesystem makes the later
      `fs.rename` fail with EXDEV. (4) The DB stores only a RELATIVE `storage_key`;
      an absolute path there turns moving the mount into a data migration.
      Second migration this repo has ever run. `pnpm migration:*` builds first and
      runs against `dist/`, so a TypeScript error surfaces as a confusing migration
      failure — compile clean before generating. The migration is purely additive
      (one new table, one FK, no backfill) and reverts clean; NO destructive database
      operation appears anywhere in this change.
      Do NOT run `pnpm test:e2e`. `test/app.e2e-spec.ts` is the pre-existing failure
      that blocks add-login (see devspec/report/blockers.md); it is out of scope and
      must not be touched. `pnpm test` is this change's gate.
      devspec/context/schema.md is STALE — it claims zero domain tables while `users`
      exists with 2 rows. Task 7.3 refreshes it with both tables and fills in the
      "Not yet established" section, since users+files together settle FK naming,
      ON DELETE RESTRICT as the default, and no-soft-delete for everything after.
      ONE OPEN QUESTION, recorded in design.md: `Content-Disposition: inline` for
      images vs uniform `attachment`. Spec'd as mixed — inline for
      png/jpeg/webp/gif, attachment for pdf/docx/txt/md. Safe either way, because
      `image/svg+xml` is excluded from the allowlist (SVG is executable XML) and
      `X-Content-Type-Options: nosniff` is always sent. Switching to uniform
      attachment changes only the header helper in task 5.4 and the image scenario
      under [req-4]; nothing else depends on it.
      Known and accepted: with no consumer, nothing distinguishes a live file row
      from test leftovers, and any authenticated user can download any file by id.
      The first consuming feature adds its own `file_id` FK and the ownership model
      a per-resource check needs. Nothing enforces that it does.
  add-projects:
    title: project list, create, detail, settings and the project sidebar scope
    tasks_md: archive/add-projects/tasks.md
    depends_on: []
    skills: [frontend-design, typeorm]
    status: done
    archived: archive/add-projects
    owner: "worker-local"
    notes: >-
      Approved by LE AN on 2026-10-01. Artifacts complete: proposal.md, design.md,
      spec.md, tasks.md, ui.md, db.md (live-schema grounded), 5 approved mockups,
      spec.html. Req coverage is clean — req-1..req-14 each have a tasks.md
      section, all 13 sections carry a runnable Verify: line, and there is NO
      MANUAL gate anywhere, so the worker never stalls on a human tick.
      First domain spine in the repo. Everything downstream (context documents,
      discovery plan, meetings, requirements, questions, decisions) hangs off a
      project, so this change is what unblocks add-project-context, add-meetings
      and add-requirements — each fills one disabled sidebar row and one Overview
      stage.
      `depends_on: []` on purpose. This change consumes add-login's output (the
      `users` table, JwtAuthGuard, SESSION_COOKIE) and add-app-shell's sidebar,
      plus add-feedback-layer's confirm provider and toasts — all four are now
      status done and archived, and their code is in the working tree. Nothing is
      waiting on anything.
      THE NAV REWRITE IS THE ONE HIGH-RISK EDIT. `frontend/constants/nav.ts`
      currently feeds BOTH the desktop sidebar (`nav-groups.tsx`) and the mobile
      drawer (`mobile-nav.tsx`) from one `NAV_ITEMS` array, so the two cannot
      drift. Section 8 splits it into two scopes behind one `useNavScope()` hook;
      the single-source property must survive. Both renderers keep rendering one
      `<NavGroups>` — giving the drawer its own source is the defect to watch for.
      `types/nav.ts` loses "Insights" with the four global rows that used it; a
      leftover union member renders an empty group header. Land section 8 as its
      own commit — it is the only edit that is awkward to revert piecemeal.
      Second biggest defect risk is transcription, not design: section 7
      hand-copies three missing primitives (`dialog.tsx`, `table.tsx`,
      `textarea.tsx`) because the shadcn CLI hangs in this environment
      (devspec/context/rules.md). No new dependency is needed — the installed
      `radix-ui` umbrella package exports the namespace objects, so dialog.tsx
      imports `{ Dialog as DialogPrimitive } from "radix-ui"` exactly as
      `sheet.tsx` and `alert-dialog.tsx` already do. `alert-dialog.tsx` is NOT a
      substitute for `dialog.tsx`: no close button, outside-click dismissal
      blocked by design, and owned by the confirm provider. tsc + eslint + actually
      rendering each one is the check.
      Third migration this repo has ever run, and purely additive: two new tables,
      three FKs, two unique constraints, one index, two CHECK constraints. No
      column on an existing table is added, altered or dropped, there is no
      backfill, and NO destructive database operation appears anywhere in this
      change. It reverts clean by dropping the two tables in FK order. There is no
      hard delete in the service and none in the UI — archive is `status='archived'`.
      `pnpm migration:*` builds first and runs against `dist/`, so compile clean
      before generating or a TypeScript error surfaces as a confusing migration
      failure.
      Entity registration is the same trap add-file-storage documented:
      `app.module.ts` passes `entities: []` + `autoLoadEntities: true` on purpose
      (the raw-.ts glob breaks vitest), so `TypeOrmModule.forFeature([Project,
      ProjectMember])` inside ProjectsModule is the ONLY thing that registers
      either entity. Registering them anywhere else is a silent no-op.
      THREE ACCESS DECISIONS A REVIEWER SHOULD CHECK AGAINST THE CODE, because the
      UI must not be the only thing enforcing them. (1) A non-member gets 404
      PROJECT_NOT_FOUND, never 403 — a 403 confirms the project exists. (2) A
      member attempting an owner-only write gets 403 PROJECT_NOT_OWNER, because
      they already know it exists; collapsing both into 404 would read as a bug.
      (3) PATCH and member add/remove on an archived project return 409
      PROJECT_ARCHIVED — ui.md renders those controls disabled and the API agrees
      independently. The membership gate lives in ProjectsService, not the
      controller, and the list query starts FROM `project_members WHERE user_id =
      viewer` and joins outward — keep that join direction if the query is ever
      rewritten, it is the security property. Creation writes the project row and
      the owner membership row in ONE transaction; a project with no owner row
      would be unreachable through every endpoint.
      ONE SCOPE ADDITION beyond proposal.md's scope-in table, flagged to and
      accepted by LE AN: section 5 gives `pnpm seed` an optional second account
      (SEED_MEMBER_EMAIL / _PASSWORD / _NAME, the first @IsOptional() vars in the
      env contract). Verification needs it — member-vs-owner and non-member are
      three of this change's states and devspec/improve/testing.md records only
      admin@clarivo.local, while Clarivo has no signup endpoint. Optional on
      purpose: a required var would invalidate every existing .env, the cost
      FILE_STORAGE_PATH already imposed once. Credentials go in the gitignored
      devspec/improve/testing.md; .env.example gets empty commented rows and no
      password is ever committed.
      The four Overview stage counts (Context documents / Meetings held /
      Requirements collected / Open questions) are FRONTEND CONSTANTS in
      `constants/project-stages.ts`, not API fields. An API returning
      `requirementsCount: 0` from a table that does not exist is a field that lies
      by construction, and the first change to add requirements would have to
      decide whether the old zero was real. `memberCount` IS a real API field
      because project_members exists. Same honest-zero rule on the dashboard. The
      reference image's 78% health ring and its Known/Unknown/Conflicts/Questions
      counters are deliberately cut — ui.md records why.
      design.md carries 28 Decision Defaults under ## Impact Area. That is what
      lets the worker decide instead of blocking, so read them before treating any
      gray area as underspecified.
      Two cleanups ride along and must land with their replacements: section 12
      deletes `FeedbackDemoCard` from `app/(app)/page.tsx` (add-feedback-layer left
      a `ponytail:` comment asking for exactly this and nothing else enforces it)
      and removes RECENT_PROJECTS / NEXT_MEETING / the projects Stat from
      `constants/dashboard.ts` plus the orphaned types in `types/dashboard.ts`.
      Those orphans are created by this change, so they go; nothing else in those
      files is touched.
      Do NOT run `pnpm test:e2e` and do not touch `backend/test/app.e2e-spec.ts`.
      It asserts GET / -> "Hello World!" against an AppController this repo does
      not have, it was already failing before any DevSpec change started, and it is
      logged in devspec/report/blockers.md. `pnpm test` is this change's backend
      gate. add-login was closed as done with that item explicitly out of scope.
      devspec/context/conventions.md is STALE for the frontend — it still describes
      `@/*` -> ./app/* with everything under app/. `frontend/CLAUDE.md` is
      authoritative: `@/*` resolves from the frontend root, and it also carries the
      layer law (component -> hooks/ -> services/ -> lib/api), the react-hook-form
      + zod rule and the never-`watch()` constraint. Refreshing the context pack is
      a separate job. Task 13.2 does refresh devspec/context/schema.md, which this
      change settles four open items in: enums as varchar + CHECK, the first
      composite unique, the first `date` columns (serialised as 'YYYY-MM-DD'
      strings, not Date), and the first ON DELETE CASCADE — recorded WITH the
      reasoning that keeps RESTRICT the default, so the next change does not read
      one CASCADE as blanket permission.
  add-project-context:
    title: context documents + web research, one editable summary.md with diagrams
    tasks_md: changes/add-project-context/tasks.md
    depends_on: []
    skills: [frontend-design, typeorm]
    status: blocked
    owner: "worker-local"
    notes: >-
      BLOCKED on the live UI verify only (sections 9-10). All code built; backend 172/172 unit tests; frontend tsc/eslint/build clean; backend boots live with all 7 routes. The `/devspec-verify` live agent-browser run needs real AI_API_KEY/TAVILY_API_KEY + the dev server — see devspec/report/blockers.md. Reset to pending/done after a human runs it with real keys.
      Approved by LE AN on 2026-10-02. RE-SPEC — supersedes the reverted
      block/proposal/review build (DropProjectContext migration ran; src/context
      was removed; verify/ screenshots are of the OLD UI). Artifacts rewritten:
      proposal.md, design.md, spec.md, tasks.md, ui.md, db.md (live psql), the
      approved mockup mockups/context.html (5 states), spec.html. Coverage CLEAN:
      req-1..req-12 each map to a tasks.md section (0..10), every section carries
      a runnable Verify:, NO MANUAL gate — the worker never stalls on a human tick.
      `depends_on: []` on purpose. This change consumes add-projects (projects /
      project_members + membership lookup), add-file-storage (FilesService, the
      files table, multer) and add-feedback-layer (confirm provider + global
      toast) — all done and archived, code in the working tree. Nothing waits on
      anything.
      THE MODEL IS ONE EDITABLE summary.md PER PROJECT, NOT BLOCKS. The old
      block/knowledge_refs/review-queue shape was reverted and is gone. Knowledge
      is a single project_knowledge.summary_md (fixed ## sections). Citations are
      an inline `Sources:` line per section; conflicts an inline `⚠ Sources
      differ` note; diagrams are ```mermaid fences INSIDE the md (not a type, not
      a table). No proposals, no accept/reject queue. Do NOT recreate
      knowledge_blocks / knowledge_refs — DropProjectContext already removed them.
      TWO FEEDERS, ONE OUTPUT: documents (upload via FilesService) AND web
      research (Tavily, company name or URL -> draft -> human confirms -> folds
      in, URL-cited). Processing is ONE "Process all" over every unprocessed
      source in one background run + a boot-time stuck-row sweep — NOT a
      per-document pipeline, NOT a job queue (ponytail comment names the ceiling).
      AI STACK IS LANGCHAIN / LANGGRAPH (BA decision — see improve/decisions.md).
      AiClient wraps `@langchain/openai` ChatOpenAI at AI_BASE_URL (FAST/STRONG
      split); web research wraps `@langchain/tavily` TavilySearch — the SAME tool
      the later discovery-agent change reuses, then adds `@langchain/langgraph`.
      SECTION 0 IS A LOAD-SPIKE, NOT A FORMALITY: the backend is CommonJS and
      conventions.md forbids ESM-only deps. These packages are dual-published
      (exports.require -> .cjs, verified on npm 2026-10-02), but task 0.2 proves
      they resolve and run under THIS tsconfig before anything depends on them;
      fallback is the native-`fetch` client (design.md rejected row). langgraph is
      deferred to the discovery change.
      SECTION 8 IS THE SECURITY BOUNDARY. FilesController.download
      (backend/src/files/files.controller.ts) currently guards with JwtAuthGuard
      only — any authenticated user can download any file by id. This change gives
      doc sources owners, so the hole closes in the same change: a file WITH a
      project_documents(source_type='doc') row requires project membership; a file
      WITHOUT one keeps today's behaviour; web sources have no file_id and never
      hit this path. Tests-first (8.2). Keep ONE download route.
      FIVE REQUIRED ENV VARS INVALIDATE EVERY EXISTING `.env`: AI_BASE_URL,
      AI_API_KEY, AI_MODEL_FAST, AI_MODEL_STRONG, TAVILY_API_KEY — no code default
      per rules.md (the process dies at boot on a missing one). The .env.example
      rows (task 1.2) are what make it survivable. NEVER commit a real key.
      DB IS PURELY ADDITIVE: two new tables (project_documents reshaped,
      project_knowledge new, UNIQUE project_id), one migration, reverts clean. No
      existing column altered/dropped, no backfill, NO DESTRUCTIVE OP. extracted_text
      is STORED (parse cache, not RAG/embeddings) so Regenerate needn't re-parse or
      re-hit Tavily. `pnpm migration:*` builds first and runs against dist/ — compile
      clean first or a TS error surfaces as a confusing migration failure. Register
      entities via TypeOrmModule.forFeature in ContextModule (autoLoadEntities trap).
      REGENERATE NEVER CLOBBERS A HUMAN EDIT: project_knowledge.edited gates it —
      regenerate on an edited summary throws CONTEXT_SUMMARY_EDITED unless the body
      carries force:true (the UI confirm resends with force).
      FRONTEND: new route app/(app)/projects/[id]/context/page.tsx built to
      mockups/context.html; enable the Context sidebar row (was disabled); Overview
      stage 1 reads the real source count. No shared components/ui exists (reverted)
      — add shadcn primitives by hand (CLI hangs, rules.md). mermaid is a new dep,
      lazy-loaded; a render failure shows the fenced source, never a blank box.
      design.md ## Impact Area carries 10 Decision Defaults — read them before
      treating any gray area as underspecified. Open questions (pruning failed/old
      sources; re-upload coexistence) are recorded there and in db.md, deliberately
      NOT specced (a prune path is a destructive DB op for a human).
      Do NOT run `pnpm test:e2e` or touch backend/test/app.e2e-spec.ts — it asserts
      GET / -> "Hello World!" against an AppController this repo lacks, was failing
      before any DevSpec change, and is logged in devspec/report/blockers.md.
      `pnpm test` is this change's backend gate. frontend/CLAUDE.md is authoritative
      over the stale frontend block in context/conventions.md.
  add-profile:
    title: profile modal — avatar upload, display name, change password
    tasks_md: changes/add-profile/tasks.md
    depends_on: []
    skills: [frontend-design, typeorm]
    status: doing
    owner: "worker-local"
    notes: >-
      Approved by LE AN on 2026-10-02. Artifacts complete: proposal.md, design.md,
      spec.md (req-1..req-7), tasks.md (10 sections, every section a runnable
      Verify: line, NO MANUAL gate), ui.md, db.md (live-schema grounded, read from
      psql not migration files), 1 approved mockup (profile.html, 5 states), spec.html.
      Req coverage clean — req-1 → s1, req-2 → s2+s7, req-3 → s4/5/7/9/10,
      req-4 → s3/4/5/7/9/10, req-5 → s4/6/7/9/10, req-6 → s8, req-7 → s10. No orphans.
      `depends_on: []` on purpose. Everything consumed is already built and in the
      working tree: the `users` table + JwtAuthGuard + SESSION_COOKIE (add-login),
      FilesService + the `files` table + the exported multer config (add-file-storage),
      the global MutationCache toast + confirm provider (add-feedback-layer), and the
      nav-user dropdown (add-app-shell). Nothing waits on anything.
      THE ONE ARCHITECTURAL TRAP IS A CIRCULAR MODULE IMPORT, and design.md's chosen
      approach exists to avoid it. The import chain is already
      FilesModule → ProjectsModule → UsersModule, so putting the avatar endpoint on a
      UsersController inside UsersModule (which would need FilesModule for multer +
      FilesService) closes the cycle Users→Files→Projects→Users and forces forwardRef.
      Instead a NEW leaf `backend/src/profile/` module imports UsersModule + FilesModule;
      routes still live at `/users/me` because `@Controller('users/me')` is just a path
      string. Do not "simplify" this back into UsersModule.
      `AuthService.validate` IS DELIBERATELY NOT TOUCHED. It is the credential path with
      an oracle test (auth.service.spec asserts unknown-email == bad-password, identical
      error). Password change gets its own tiny `users/password.ts` helper
      (hashPassword/verifyPassword, argon2id) used only by the new path — this is the
      FIRST place the app hashes a password (seed hashes externally). Editing validate or
      its spec is out of scope and a regression risk.
      SECTION 1 ADDS THE 5TH MIGRATION, purely additive: one nullable
      `users.avatar_file_id uuid` + FK → files(id) ON DELETE RESTRICT. No backfill (2 user
      rows → NULL), reverts clean, NO destructive op anywhere. It creates a cycle in the FK
      graph with the existing files.uploaded_by → users edge; this is SAFE ONLY BECAUSE the
      column is nullable (user row inserts with NULL avatar, file uploaded after, then the
      id is set). A NOT NULL avatar column would be unsatisfiable — keep it nullable.
      `pnpm migration:*` builds first and runs against `dist/`, so compile clean before
      generating or a TS error surfaces as a confusing migration failure.
      THE AVATAR DISPLAY NEEDS A NEXT REWRITE PROXY, not a new endpoint. `GET /files/:id`
      is cookie-guarded; a cross-origin `<img>` from :3001 sends no cookie → 401. next.config
      rewrites `/api/files/:path*` → `${NEXT_PUBLIC_API_URL}/files/:path*` (reuses the
      existing env, NO new var) so the image loads same-origin with the cookie forwarded
      server-side. A second public/unguarded avatar route was rejected — files.controller.ts
